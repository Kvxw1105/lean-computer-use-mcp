<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉 API 配置</title>
<style>
  /* ---- dark theme (default) ---- */
  :root {
    --blue: #5b7cfa; --blue-soft: rgba(91,124,250,.16);
    --purple: #a86bff; --purple-soft: rgba(168,107,255,.16);
    --bg: #0e1017;
    --bg-glow-a: rgba(91,124,250,.16); --bg-glow-b: rgba(168,107,255,.14); --bg-glow-c: rgba(91,124,250,.07);
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.09);
    --card-hover: rgba(255,255,255,.07);
    --input-bg: rgba(10,12,18,.72); --input-bg-focus: rgba(10,12,18,.9);
    --text: #eceef6; --muted: #9aa1b8; --faint: #6b7188;
    --ok: #4ade9b; --ok-soft: rgba(74,222,155,.14);
    --err: #ff7a7a; --err-soft: rgba(255,122,122,.14);
    --badge-text: #aebcff; --badge-border: rgba(91,124,250,.38);
    --badge-first-text: #d3c1ff; --badge-first-border: rgba(150,110,255,.5);
    --shadow: 0 12px 40px rgba(0,0,0,.28);
    --toast-bg: rgba(20,24,38,.92); --toast-border: rgba(255,255,255,.09); --toast-shadow: 0 10px 34px rgba(0,0,0,.5);
    --btn-bg: rgba(255,255,255,.06); --btn-bg-hover: rgba(255,255,255,.1);
    --radius: 16px;
    --ease: cubic-bezier(.22,.8,.32,1);
    color-scheme: dark;
  }
  /* follow the system when the user has not chosen manually */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --blue: #4a6af2; --blue-soft: rgba(74,106,242,.12);
      --purple: #9357e8; --purple-soft: rgba(147,87,232,.12);
      --bg: #f3f5fb;
      --bg-glow-a: rgba(74,106,242,.14); --bg-glow-b: rgba(147,87,232,.12); --bg-glow-c: rgba(74,106,242,.06);
      --card: rgba(255,255,255,.72);
      --card-border: rgba(23,27,46,.10);
      --card-hover: rgba(255,255,255,.92);
      --input-bg: rgba(255,255,255,.85); --input-bg-focus: #ffffff;
      --text: #22263a; --muted: #5c6280; --faint: #8a90a8;
      --ok: #179a63; --ok-soft: rgba(23,154,99,.12);
      --err: #d64545; --err-soft: rgba(214,69,69,.10);
      --badge-text: #3f5ae0; --badge-border: rgba(74,106,242,.35);
      --badge-first-text: #7a4fd6; --badge-first-border: rgba(147,87,232,.45);
      --shadow: 0 12px 36px rgba(30,36,70,.10);
      --toast-bg: rgba(255,255,255,.94); --toast-border: rgba(23,27,46,.12); --toast-shadow: 0 10px 30px rgba(30,36,70,.16);
      --btn-bg: rgba(23,27,46,.05); --btn-bg-hover: rgba(23,27,46,.09);
      color-scheme: light;
    }
  }
  /* manual light choice */
  :root[data-theme="light"] {
    --blue: #4a6af2; --blue-soft: rgba(74,106,242,.12);
    --purple: #9357e8; --purple-soft: rgba(147,87,232,.12);
    --bg: #f3f5fb;
    --bg-glow-a: rgba(74,106,242,.14); --bg-glow-b: rgba(147,87,232,.12); --bg-glow-c: rgba(74,106,242,.06);
    --card: rgba(255,255,255,.72);
    --card-border: rgba(23,27,46,.10);
    --card-hover: rgba(255,255,255,.92);
    --input-bg: rgba(255,255,255,.85); --input-bg-focus: #ffffff;
    --text: #22263a; --muted: #5c6280; --faint: #8a90a8;
    --ok: #179a63; --ok-soft: rgba(23,154,99,.12);
    --err: #d64545; --err-soft: rgba(214,69,69,.10);
    --badge-text: #3f5ae0; --badge-border: rgba(74,106,242,.35);
    --badge-first-text: #7a4fd6; --badge-first-border: rgba(147,87,232,.45);
    --shadow: 0 12px 36px rgba(30,36,70,.10);
    --toast-bg: rgba(255,255,255,.94); --toast-border: rgba(23,27,46,.12); --toast-shadow: 0 10px 30px rgba(30,36,70,.16);
    --btn-bg: rgba(23,27,46,.05); --btn-bg-hover: rgba(23,27,46,.09);
    color-scheme: light;
  }
  /* manual dark choice (same values as the default) */
  :root[data-theme="dark"] {
    --blue: #5b7cfa; --blue-soft: rgba(91,124,250,.16);
    --purple: #a86bff; --purple-soft: rgba(168,107,255,.16);
    --bg: #0e1017;
    --bg-glow-a: rgba(91,124,250,.16); --bg-glow-b: rgba(168,107,255,.14); --bg-glow-c: rgba(91,124,250,.07);
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.09);
    --card-hover: rgba(255,255,255,.07);
    --input-bg: rgba(10,12,18,.72); --input-bg-focus: rgba(10,12,18,.9);
    --text: #eceef6; --muted: #9aa1b8; --faint: #6b7188;
    --ok: #4ade9b; --ok-soft: rgba(74,222,155,.14);
    --err: #ff7a7a; --err-soft: rgba(255,122,122,.14);
    --badge-text: #aebcff; --badge-border: rgba(91,124,250,.38);
    --badge-first-text: #d3c1ff; --badge-first-border: rgba(150,110,255,.5);
    --shadow: 0 12px 40px rgba(0,0,0,.28);
    --toast-bg: rgba(20,24,38,.92); --toast-border: rgba(255,255,255,.09); --toast-shadow: 0 10px 34px rgba(0,0,0,.5);
    --btn-bg: rgba(255,255,255,.06); --btn-bg-hover: rgba(255,255,255,.1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 15% -8%, var(--bg-glow-a), transparent 60%),
      radial-gradient(800px 460px at 88% 0%, var(--bg-glow-b), transparent 55%),
      radial-gradient(1000px 600px at 50% 115%, var(--bg-glow-c), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .4s var(--ease), color .3s var(--ease);
  }
  header { padding: 30px 32px 14px; max-width: 900px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .theme-btn {
    width: 40px; height: 40px; border-radius: 12px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    transition: transform .3s var(--ease), background .25s, border-color .25s;
  }
  .theme-btn:hover { transform: translateY(-1px) rotate(-8deg); }
  .theme-btn svg { width: 18px; height: 18px; stroke: var(--muted); fill: none;
                   stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .theme-btn:hover svg { stroke: var(--text); }
  .theme-btn .icon-sun { display: none; }
  :root[data-theme="light"] .theme-btn .icon-sun { display: block; }
  :root[data-theme="light"] .theme-btn .icon-moon { display: none; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 32px 40px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 18px;
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
    transition: background .35s var(--ease), border-color .3s var(--ease), box-shadow .35s var(--ease);
  }
  .card h2 {
    margin: 0 0 16px; font-size: 13px; font-weight: 600;
    color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2::before {
    content: ""; width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    box-shadow: 0 0 12px rgba(130,106,250,.6);
  }

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  label { font-size: 12.5px; color: var(--muted); min-width: 62px; }
  input, select {
    flex: 1; min-width: 200px;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 10px;
    padding: 9px 12px; font-size: 13.5px; outline: none;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .25s var(--ease), color .25s var(--ease);
  }
  input::placeholder { color: var(--faint); }
  input:focus, select:focus {
    border-color: rgba(91,124,250,.65);
    box-shadow: 0 0 0 3px var(--blue-soft);
    background: var(--input-bg-focus);
  }

  /* ---- provider items ---- */
  .provider {
    border: 1px solid var(--card-border); border-radius: 13px;
    padding: 14px 16px; margin-bottom: 12px;
    background: var(--card);
    transition: transform .3s var(--ease), border-color .25s, background .25s, opacity .3s var(--ease), height .3s var(--ease);
    animation: rise .38s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  .provider:hover { border-color: rgba(255,255,255,.18); background: var(--card-hover); }
  .provider.removing {
    opacity: 0; transform: translateX(26px) scale(.97);
    height: 0 !important; padding-top: 0; padding-bottom: 0; margin-bottom: 0;
    border-width: 0; overflow: hidden;
    transition: opacity .3s var(--ease), transform .3s var(--ease), height .34s var(--ease),
                padding .34s var(--ease), margin .34s var(--ease), border .34s var(--ease);
  }
  .provider.moving { transition: transform .35s var(--ease); }
  .provider .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .badge {
    background: var(--blue-soft); color: var(--badge-text);
    border: 1px solid var(--badge-border); border-radius: 999px;
    font-size: 11.5px; font-weight: 600; padding: 3px 11px; letter-spacing: .4px;
    transition: color .25s var(--ease), border-color .25s var(--ease);
  }
  .badge.first {
    background: linear-gradient(120deg, var(--blue-soft), var(--purple-soft));
    border-color: var(--badge-first-border); color: var(--badge-first-text);
    box-shadow: 0 0 14px rgba(130,106,250,.28);
  }
  .provider .host { font-weight: 650; font-size: 14px; letter-spacing: .2px; }
  .provider .meta { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-left: auto; }

  /* ---- buttons ---- */
  button {
    background: var(--btn-bg); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 10px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    transition: transform .16s var(--ease), background .25s, border-color .25s, box-shadow .25s, opacity .2s, color .25s;
  }
  button:hover { border-color: rgba(120,145,255,.5); background: var(--btn-bg-hover); transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(.97); }
  button:disabled { opacity: .38; cursor: not-allowed; transform: none; }
  button.primary {
    background: linear-gradient(120deg, var(--blue), var(--purple));
    border: none; font-weight: 650; color: #fff;
    box-shadow: 0 6px 22px rgba(110,100,255,.32);
  }
  button.primary:hover { box-shadow: 0 8px 28px rgba(110,100,255,.45); filter: brightness(1.06); }
  button.danger { color: var(--err); border-color: rgba(255,122,122,.35); }
  button.danger:hover { background: var(--err-soft); border-color: rgba(255,122,122,.6); }
  button.ok { color: var(--ok); border-color: rgba(74,222,155,.35); }
  button.ok:hover { background: var(--ok-soft); border-color: rgba(74,222,155,.6); }
  button.spinning { pointer-events: none; opacity: .75; }
  button.spinning::before {
    content: ""; display: inline-block; width: 11px; height: 11px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: currentColor;
    border-radius: 50%; margin-right: 6px; vertical-align: -1px;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .add-btn { width: 100%; padding: 11px; border-style: dashed; border-color: var(--card-border); color: var(--muted); background: transparent; }
  .add-btn:hover { color: var(--text); border-color: rgba(120,145,255,.55); }

  .footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--faint); line-height: 1.7; margin: 14px 0 0; }

  /* ---- toast ---- */
  #toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-80px);
    padding: 11px 20px; border-radius: 999px; font-size: 13px; z-index: 50;
    background: var(--toast-bg); border: 1px solid var(--toast-border);
    box-shadow: var(--toast-shadow);
    opacity: 0; pointer-events: none;
    transition: transform .45s var(--ease), opacity .35s var(--ease), background .35s var(--ease), border-color .3s var(--ease);
    backdrop-filter: blur(8px);
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.ok { border-color: rgba(74,222,155,.5); color: var(--ok); }
  #toast.err { border-color: rgba(255,122,122,.5); color: var(--err); }

  .test-result { font-size: 12.5px; margin-top: 8px; min-height: 0; animation: rise .3s var(--ease) both; }
  .test-result.ok { color: var(--ok); }
  .test-result.err { color: var(--err); }
  .test-result.testing { color: var(--muted); }

  /* ---- empty state ---- */
  #empty {
    text-align: center; padding: 34px 20px 26px; color: var(--muted);
    animation: rise .4s var(--ease) both;
  }
  #empty .orb {
    width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 18px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    opacity: .85; box-shadow: 0 0 34px rgba(130,106,250,.5);
    animation: floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(6deg); } }
  #empty p { margin: 0 0 18px; font-size: 13.5px; line-height: 1.7; }
</style>
</head>
<body>
﻿<header>
  <div class="header-top">
    <div>
      <h1>视觉 API 配置</h1>
      <p>管理用于界面识别的 AI 视觉端点：支持多个渠道、自动故障切换。保存后重启 MCP 服务生效。</p>
    </div>
    <button class="theme-btn" id="theme-btn" title="切换深浅色">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>
    </button>
  </div>
</header>
<main>
  <div class="card">
    <h2>全局设置</h2>
    <div class="row">
      <label>视觉引擎</label>
      <select id="engine">
        <option value="llm">llm（多模态 API，推荐）</option>
        <option value="winrt_ocr">winrt_ocr（本地 OCR）</option>
        <option value="rapidocr">rapidocr（本地 OCR）</option>
        <option value="none">none（关闭）</option>
      </select>
    </div>
    <div class="row">
      <label>默认模型</label>
      <input id="default-model" placeholder="例如 gpt-5.6-luna（端点未指定模型时使用）">
    </div>
  </div>

  <div class="card">
    <h2>端点列表</h2>
    <div id="providers"></div>
    <div id="empty" hidden>
      <div class="orb"></div>
      <p>还没有配置任何端点。<br>点击下方按钮添加你的第一个视觉渠道。</p>
      <button id="empty-add" class="primary">+ 添加端点</button>
    </div>
    <button id="add" class="add-btn">+ 添加端点</button>
  </div>

  <div class="card">
    <div class="footer">
      <button id="save" class="primary">保存配置</button>
      <button id="test-all">测试全部</button>
      <span class="hint" style="margin:0">第一个为优先，失效自动切换下一个</span>
    </div>
    <p class="hint">保存位置：用户目录下 .lean-cu/config.json。密钥仅保存在本机，界面只显示掩码。
    401/403 认证失败冷却 10 分钟，瞬时错误冷却 30 秒，冷却结束后自动恢复首选端点。</p>
  </div>
</main>
<div id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const api = (path, opts) => fetch(path + "?t=" + encodeURIComponent(TOKEN), opts);

/* ---- theme: follow the system, manual override saved locally ---- */
const THEME_KEY = "lean-cu-theme";
function systemTheme() {
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function currentTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  return saved === "light" || saved === "dark" ? saved : systemTheme();
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
}
document.getElementById("theme-btn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});
applyTheme(currentTheme());
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme(systemTheme());
});

let state = { engine: "llm", model: "", providers: [] };
let toastTimer = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function toast(text, ok) {
  const node = document.getElementById("toast");
  node.textContent = text;
  node.className = "show " + (ok ? "ok" : "err");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { node.className = ""; }, 3200);
}

function render() {
  const box = document.getElementById("providers");
  box.textContent = "";
  const empty = document.getElementById("empty");
  const addBtn = document.getElementById("add");
  empty.hidden = state.providers.length > 0;
  addBtn.hidden = state.providers.length === 0;

  state.providers.forEach((p, i) => {
    const card = el("div", "provider");
    card.dataset.index = i;
    const head = el("div", "head");
    head.appendChild(el("span", "badge" + (i === 0 ? " first" : ""), i === 0 ? "首选" : "备用 " + i));
    head.appendChild(el("span", "host", p.host || p.api_base));
    head.appendChild(el("span", "meta", p.key_masked));
    const actions = el("div", "actions");
    const up = el("button", "", "↑");
    up.title = "设为更优先";
    up.disabled = i === 0;
    up.onclick = () => moveCard(card, i, i - 1);
    const down = el("button", "", "↓");
    down.title = "设为更靠后";
    down.disabled = i === state.providers.length - 1;
    down.onclick = () => moveCard(card, i, i + 1);
    const test = el("button", "ok", "测试");
    test.onclick = () => testEndpoint(i);
    const del = el("button", "danger", "删除");
    del.onclick = () => removeCard(card, i);
    actions.append(up, down, test, del);
    head.appendChild(actions);
    card.appendChild(head);

    const baseRow = el("div", "row");
    baseRow.appendChild(el("label", "", "接口地址"));
    const baseInput = el("input");
    baseInput.value = p.api_base;
    baseInput.placeholder = "https://example.com/v1";
    baseInput.oninput = () => { p.api_base = baseInput.value; p.host = ""; };
    baseRow.appendChild(baseInput);
    card.appendChild(baseRow);

    const modelRow = el("div", "row");
    modelRow.appendChild(el("label", "", "模型"));
    const modelInput = el("input");
    modelInput.value = p.model;
    modelInput.placeholder = "留空使用默认模型";
    modelInput.oninput = () => { p.model = modelInput.value; };
    modelRow.appendChild(modelInput);
    card.appendChild(modelRow);

    const keyRow = el("div", "row");
    keyRow.appendChild(el("label", "", "密钥"));
    const keyInput = el("input");
    keyInput.type = "password";
    keyInput.placeholder = "留空保持不变";
    keyInput.oninput = () => { p.api_key = keyInput.value; };
    keyRow.appendChild(keyInput);
    card.appendChild(keyRow);

    card.appendChild(el("div", "test-result"));
    box.appendChild(card);
  });
}

/* graceful move: FLIP-animate the two swapped cards, then re-render */
function moveCard(card, from, to) {
  if (to < 0 || to >= state.providers.length) return;
  const cards = Array.from(document.getElementById("providers").children);
  const a = cards[from], b = cards[to];
  const aTop = a.offsetTop, bTop = b.offsetTop;
  [state.providers[to], state.providers[from]] = [state.providers[from], state.providers[to]];
  a.classList.add("moving"); b.classList.add("moving");
  a.style.transform = "translateY(" + (bTop - aTop) + "px)";
  b.style.transform = "translateY(" + (aTop - bTop) + "px)";
  setTimeout(() => {
    render();  // full rebuild keeps the input rows and current values
  }, 360);
}

/* graceful remove: collapse the card, then drop it from state */
function removeCard(card, index) {
  card.classList.add("removing");
  setTimeout(() => {
    state.providers.splice(index, 1);
    render();
    toast("已删除端点", true);
  }, 340);
}

async function load() {
  try {
    const res = await api("/api/config");
    if (!res.ok) throw new Error("加载失败: " + res.status);
    const data = await res.json();
    state = { engine: data.engine, model: data.model, providers: data.providers.map(p => ({ ...p, api_key: "" })) };
    document.getElementById("engine").value = data.engine;
    document.getElementById("default-model").value = data.model;
    render();
  } catch (err) {
    toast(String(err), false);
  }
}

async function save() {
  const btn = document.getElementById("save");
  btn.disabled = true;
  const body = {
    engine: document.getElementById("engine").value,
    model: document.getElementById("default-model").value,
    providers: state.providers.map(p => ({
      api_base: (p.api_base || "").trim(),
      api_key: (p.api_key || "").trim(),
      model: (p.model || "").trim(),
    })),
  };
  try {
    const res = await api("/api/config", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "保存失败");
    await load();
    toast("已保存，重启 MCP 服务后生效", true);
  } catch (err) {
    toast(String(err), false);
  } finally {
    btn.disabled = false;
  }
}

async function testEndpoint(index) {
  const p = state.providers[index];
  const cards = document.querySelectorAll(".provider");
  const result = cards[index].querySelector(".test-result");
  const btn = cards[index].querySelector(".actions button.ok");
  result.textContent = "正在测试…";
  result.className = "test-result testing";
  btn.classList.add("spinning");
  btn.disabled = true;
  const body = {
    api_base: (p.api_base || "").trim(),
    api_key: (p.api_key || "").trim(),
    model: ((p.model || "").trim() || document.getElementById("default-model").value.trim()),
  };
  try {
    const res = await api("/api/test", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) {
      result.textContent = "可用 · HTTP " + data.status + " · " + Math.round(data.latency_ms) + "ms";
      result.className = "test-result ok";
    } else {
      result.textContent = "失败 · " + (data.error || "") + (data.status ? " · HTTP " + data.status : "");
      result.className = "test-result err";
    }
  } catch (err) {
    result.textContent = "测试失败: " + err;
    result.className = "test-result err";
  } finally {
    btn.classList.remove("spinning");
    btn.disabled = false;
  }
}

async function testAll() {
  for (let i = 0; i < state.providers.length; i++) {
    await testEndpoint(i);
  }
}

function addProvider() {
  state.providers.push({ api_base: "", model: "", key_masked: "未设置", api_key: "" });
  render();
  const inputs = document.querySelectorAll(".provider:last-of-type input");
  if (inputs.length) inputs[0].focus();
}

document.getElementById("save").onclick = save;
document.getElementById("test-all").onclick = testAll;
document.getElementById("add").onclick = addProvider;
document.getElementById("empty-add").onclick = addProvider;
load();
</script>
</body>
</html>
